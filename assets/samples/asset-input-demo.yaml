# Asset Input Demo - Demonstrates Input Asset Feature
# Uses pre-generated product images instead of DALL-E generation

campaign_id: asset-input-demo-2025

products:
  - name: "EcoBottle Pro"
    description: "Sustainable water bottle with smart hydration tracking. Features BPA-free materials and connects to mobile app for daily water intake goals."
    input_asset: "assets/images/ecobottle-pro.png"

  - name: "SolarCharge Mini"
    description: "Portable solar power bank for mobile devices. Charges phones, tablets, and earbuds using renewable solar energy. Perfect for outdoor enthusiasts."
    input_asset: "assets/images/solarcharge-mini.png"

target_market: "North America"

target_audience: "Eco-conscious millennials and Gen Z, ages 25-35, tech-savvy professionals who prioritize sustainability"

campaign_message: "Power your day, naturally. Save the planet, one charge at a time."

brand_guidelines:
  primary_color: "#2E7D32"     # Forest Green (eco-friendly theme)
  secondary_color: "#FFC107"   # Amber (energy/solar theme)
  logo_required: true
  font_family: "Arial"

# Notes for testing:
# - Demonstrates input_asset feature (avoids DALL-E API calls)
# - Pre-generated images stored in assets/images/
# - Faster generation time (no AI image generation)
# - Useful for campaigns with existing product photography
# - Expected: Campaign uses provided images, skips DALL-E generation
