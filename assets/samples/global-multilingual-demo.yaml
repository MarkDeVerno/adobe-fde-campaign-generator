# APAC Campaign - Demonstrates Azure Translator Text API Integration
# Message automatically translates from English to Simplified Chinese (zh-Hans)

campaign_id: global-tech-apac-2025

products:
  - name: "SmartHome Hub"
    description: "AI-powered central home automation controller with voice assistant, energy monitoring, security integration"

  - name: "EcoSensor Kit"
    description: "Wireless environmental monitoring system tracks air quality, temperature, humidity with mobile alerts"

# Translation Demo: APAC market triggers automatic translation to Simplified Chinese
target_market: "APAC"

target_audience: "Tech-savvy homeowners aged 28-45, early adopters, smart home enthusiasts, sustainability-focused"

# Campaign message (English) - will be translated to Simplified Chinese (zh-Hans)
# Original: "Your home, smarter. Your planet, better."
# Translated: "你的家，更智能。你的星球，更美好。"
campaign_message: "Your home, smarter. Your planet, better."

brand_guidelines:
  primary_color: "#00BCD4"      # Tech cyan
  secondary_color: "#FF6F00"    # Innovation orange
  logo_required: true
  font_family: "Inter"          # Supports CJK (Chinese, Japanese, Korean) characters

# Expected Behavior:
# 1. Campaign message translates from "en" to "zh-Hans" automatically
# 2. Translated text overlays on generated assets
# 3. Font (Inter) supports Chinese characters for proper rendering
# 4. If Azure Translator is not configured, falls back to English message
#
# To enable translation:
# - Set AZURE_TRANSLATOR_KEY in .env
# - Set AZURE_TRANSLATOR_REGION=eastus
# - See .env.template for full configuration
