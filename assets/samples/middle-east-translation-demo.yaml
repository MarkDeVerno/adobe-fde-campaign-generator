# Middle East Campaign - Arabic Translation Demo
# Message automatically translates from English to Arabic (ar)

campaign_id: mena-financial-services-2025

products:
  - name: "SecurePay Pro"
    description: "Islamic banking-compliant digital payment platform with instant transfers and fraud protection"

  - name: "WealthGuard Elite"
    description: "Shariah-compliant investment management app with real-time portfolio tracking and expert advisors"

# Translation Demo: Middle East market triggers automatic translation to Arabic
target_market: "Middle East"

target_audience: "High-net-worth individuals and business owners aged 35-55 in MENA region"

# Campaign message (English) - will be translated to Arabic (ar)
# Original: "Trust. Security. Growth."
# Translated: "الثقة. الأمان. النمو."
campaign_message: "Trust. Security. Growth."

brand_guidelines:
  primary_color: "#1B4332"      # Deep green (trust, prosperity)
  secondary_color: "#B7A57A"    # Gold accent (wealth, luxury)
  logo_required: true
  font_family: "Noto Sans Arabic"  # Supports Arabic script

# Expected Behavior:
# 1. Campaign message translates from "en" to "ar" automatically
# 2. Arabic text (right-to-left) overlays on generated assets
# 3. Font supports Arabic script for proper rendering
# 4. If Azure Translator is not configured, falls back to English message
#
# Market-to-Locale Mapping:
# - "Middle East" → "ar" (Arabic)
# - "APAC" → "zh-Hans" (Simplified Chinese)
# - "Latin America" → "es" (Spanish)
# - "Europe" → "en" (English default)
